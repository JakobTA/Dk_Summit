events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    types { application/wasm wasm; }
    default_type application/octet-stream;
    sendfile on;
    gzip_static on;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # SPA routing — all unknown paths fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Don't cache the entry point so the browser always fetches the latest fingerprinted assets
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Long-lived cache for fingerprinted framework/app assets
        location ~* \.(js|wasm|css|dll|dat|blat|pdb)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
